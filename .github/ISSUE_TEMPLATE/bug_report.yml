name: 缺陷报告
description: 记录错误推荐、服务异常、性能或安全问题
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: severity
    attributes:
      label: 严重级别
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述用户问题和预期推荐，不要填写真实客户敏感信息。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 产品资料依据
      description: 填写资料名称、版本和位置。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 不要粘贴 BotID、Secret、Webhook、客户信息或其他凭证。

